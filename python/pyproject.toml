[project]
name = "thumbdrive"
version = "0.1.0"
description = "Thumbdrive, Python edition: a read-only virtual USB drive for agents over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Direct imports only. Starlette, uvicorn and python-multipart already come with mcp;
# they are listed because Thumbdrive imports them itself. See DESIGN.md.
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[project.scripts]
thumbdrive = "thumbdrive.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
