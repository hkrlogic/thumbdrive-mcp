name: Docker image

# Builds ghcr.io/hkrlogic/thumbdrive-mcp for linux/amd64 and linux/arm64.
#   main            -> :edge
#   m1-core-drive   -> :m1
#   m3-web-ui       -> :m3
#   tag v1.2.3      -> :1.2.3, :1.2, :latest
#   every build     -> :sha-<short sha>
# Before pushing, the amd64 image is started and checked end to end.

on:
  push:
    branches: [main, m1-core-drive, m3-web-ui]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hkrlogic/thumbdrive-mcp

jobs:
  image:
    name: Build, smoke test and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=m1,enable=${{ github.ref == 'refs/heads/m1-core-drive' }}
            type=raw,value=m3,enable=${{ github.ref == 'refs/heads/m3-web-ui' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Thumbdrive MCP
            org.opencontainers.image.description=A small, read-only drive for AI agents over MCP
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build amd64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: thumbdrive-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Smoke test the image
        run: |
          set -euo pipefail
          # Default is secure: without THUMBDRIVE_HOST the published port is unreachable.
          docker run -d --name td-default -p 127.0.0.1:8485:8484 thumbdrive-mcp:test
          sleep 5
          if curl -fsS --max-time 3 http://127.0.0.1:8485/healthz; then
            echo "::error::server was reachable without THUMBDRIVE_HOST"; exit 1
          fi
          docker logs td-default 2>&1 | grep -c "THUMBDRIVE_HOST=0.0.0.0"
          docker rm -f td-default

          docker run -d --name td -e THUMBDRIVE_HOST=0.0.0.0 -p 127.0.0.1:8484:8484 -v td-data:/data thumbdrive-mcp:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' td)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' td | grep -qx healthy
          # Web UI: first run sends the browser to /setup; the CLI can set the password too.
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8484/)" = "303 http://127.0.0.1:8484/setup"
          curl -fsS -o /tmp/setup.html http://127.0.0.1:8484/setup && grep -q 'action="/setup"' /tmp/setup.html
          echo 'ci-admin-password' | docker exec -i td node dist/admin.js set-password
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8484/)" = "303 http://127.0.0.1:8484/login"
          test "$(docker exec td id -u)" != 0
          docker exec td sh -c 'echo "hello from ci" > /tmp/hello.txt && node dist/admin.js put /tmp/hello.txt /notes/hello.txt'
          OUT=$(docker exec td node dist/admin.js key create ci --folder /)
          KEY=$(grep -m1 -o 'td_[A-Za-z0-9_-]*' <<<"$OUT")
          echo "::add-mask::$KEY"
          THUMBDRIVE_KEY="$KEY" npm run -s smoke -- http://127.0.0.1:8484/mcp
          # Unknown Host headers are refused (DNS rebinding guard).
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' -X POST http://127.0.0.1:8484/mcp)
          test "$code" = 403
          docker logs td

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
